[project]
name = "retail-support-ai"
version = "0.1.0"
description = "FastAPI and LangGraph starter service for the retail support workflow builder"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "langchain-ollama>=0.3,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
